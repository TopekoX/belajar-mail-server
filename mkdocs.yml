site_name: Belajar Mail Server
site_description: Materi pembelajaran membangun dan mengelola mail server dengan Ubuntu Server.
# Diisi saat build/deploy, mis. SITE_URL=https://pengguna.github.io/repo/materi/ (opsional untuk lokal)
site_url: !ENV [SITE_URL, null]

docs_dir: materi
site_dir: site/materi
use_directory_urls: true
strict: true

theme:
  name: material
  language: id
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

# Navigasi dikelola manual sampai bab pertama diterbitkan; rancangan nav otomatis: docs/TECHNICAL-DESIGN.md bagian 4.4.1.
nav:
  - Beranda: index.md
  - "L0 · Orientasi dan Persiapan Belajar":
      - "Ringkasan Level 0": level/L0.md
      - "Orientasi Kurikulum":
          - "CH-01-01-01 · Peta Belajar dan Profil Pembelajar": chapter/CH-01-01-01.md
          - "CH-01-01-02 · Menyiapkan Lingkungan Lab (VM dan Snapshot)": chapter/CH-01-01-02.md
          - "CH-01-01-03 · Jalur Lab ke Produksi dan Etika Operasional": chapter/CH-01-01-03.md
  - "L1 · Dasar Linux dan Jaringan":
      - "Ringkasan Level 1": level/L1.md
      - "Command Line dan Administrasi Dasar":
          - "CH-02-01-01 · Konsep Linux dan Ubuntu Server": chapter/CH-02-01-01.md
          - "CH-02-01-02 · Navigasi Filesystem dan Hierarki Direktori": chapter/CH-02-01-02.md
          - "CH-02-01-03 · Pengguna, Grup, Izin, dan sudo": chapter/CH-02-01-03.md
          - "CH-02-01-04 · Manajemen Paket dengan APT": chapter/CH-02-01-04.md
          - "CH-02-01-05 · Dasar Shell Scripting": chapter/CH-02-01-05.md
      - "Service dan Proses":
          - "CH-02-02-01 · systemd dan Manajemen Service": chapter/CH-02-02-01.md
          - "CH-02-02-02 · Proses, Socket, dan Port Listening": chapter/CH-02-02-02.md
      - "Jaringan":
          - "CH-02-03-01 · Alamat IP, Subnet, Routing, dan Gateway": chapter/CH-02-03-01.md
          - "CH-02-03-02 · Resolusi DNS dan Alat Diagnosis": chapter/CH-02-03-02.md
          - "CH-02-03-03 · TCP/IP, Port, dan Firewall (UFW/nftables)": chapter/CH-02-03-03.md
          - "CH-02-03-04 · Diagnosis Koneksi dengan curl dan openssl": chapter/CH-02-03-04.md
      - "SSH":
          - "CH-02-04-01 · Administrasi Server dengan SSH": chapter/CH-02-04-01.md
  - "L2 · Fundamental Arsitektur Email":
      - "Model dan Protokol Email":
          - "CH-03-01-01 · Siklus Hidup Email dan Peran MUA, MSA, MTA, MDA": chapter/CH-03-01-01.md
