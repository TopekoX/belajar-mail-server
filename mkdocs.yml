site_name: Belajar Mail Server
site_description: Materi pembelajaran membangun dan mengelola mail server dengan Ubuntu Server.
# Diisi saat build/deploy, mis. SITE_URL=https://pengguna.github.io/repo/materi/ (opsional untuk lokal)
site_url: !ENV [SITE_URL, null]

docs_dir: materi
site_dir: site/materi
use_directory_urls: true
strict: true

hooks:
  - hooks/dashboard_links.py

theme:
  name: material
  language: id
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Mode otomatis (ikuti sistem), ganti ke mode terang
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Mode terang, ganti ke mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mode gelap, ganti ke mode otomatis
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

